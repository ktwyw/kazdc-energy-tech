<section class="page-intro tech-intro">
  <p class="kicker">KazDC-BIM · 技术研究</p><h1>技术模型<span>。</span></h1>
  <p class="deck">以同一座 IT 负荷为 {{IT_MW}} MW 的数据中心为例，探索不同的制冷或供电方式。可以比较典型年的运行结果，也可以使用冷板试验工具分析实测数据。</p>
</section>
<nav class="study-switch" aria-label="选择技术" id="study-switch"></nav>
<section class="workspace tech-work" id="model" aria-labelledby="study-title">
  <div class="heading"><div><p class="kicker" id="study-domain"></p><h2 id="study-title"></h2></div><button class="quiet" id="reset">重置本模型</button></div>
  <p class="tech-question" id="study-question"></p>
  <div class="compare-grid">
    <form class="controls" id="tech-form"><h3 id="input-title">模型输入</h3>
      <div id="place-input"><label for="city">气象站所在城市</label><select id="city"></select><p class="fine" id="weather-origin"></p></div>
      <div id="study-inputs"></div>
      <p id="input-assumptions" class="fine"></p>
    </form>
    <div class="result-panel tech-results">
      <div class="result-title"><h3 id="result-title"></h3><span id="result-type"></span></div>
      <p id="tech-error" class="error" hidden role="status"></p>
      <div id="tech-output">
        <div class="metrics" id="tech-metrics"></div>
        <p id="interpretation" class="interpretation"></p>
        <div id="chart-area"><div class="chart-head"><h3 id="chart-title"></h3><span id="chart-unit"></span></div>
          <div class="tech-plot" id="tech-chart"></div><div class="tech-legend" id="tech-legend"></div></div>
        <div class="table-wrap" id="bench-area" hidden><table id="bench-results"></table></div>
        <a class="capture-link" id="apply-capture" href="{{HEAT_URL}}" hidden>将此比例用作整个机架的假设值</a>
      </div>
    </div>
  </div>
  <div class="tech-download">{{COPY_CASE@model}}<button class="action" id="download-study">下载结果（CSV）</button></div>
  <details class="details" id="monthly-details"><summary>逐月结果与全年合计</summary><div class="table-wrap"><table id="tech-table"></table></div></details>
  <details class="details" open><summary>方法、假设与资料来源</summary><div class="details-body tech-method" id="study-method"></div></details>
</section>
<script type="application/json" id="technology-text">{{TECHNOLOGY_TEXT}}</script>
